<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Jira Time Tracker – Configuration</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <h1>Configuration</h1>
  <section>
    <h2>Utilisateur</h2>
    <form id="f">
      <label>Ton nom tel qu'affiché dans Jira
        <input id="me" placeholder="ex: Mohamed Mediouni" required>
      </label>
      <small>Sert à ne garder que tes changements de statut (onglet History). Copie le nom exactement comme dans Jira.</small>
      <button class="primary">Enregistrer</button>
      <div id="msg"></div>
    </form>
  </section>
  <section>
    <h2>Statuts à chronométrer</h2>
    <form id="f2">
      <label>Statuts séparés par des virgules (vide = tous)
        <input id="statuses" placeholder="In Test">
      </label>
      <small>Le temps passé dans ces statuts (de l'entrée à la sortie) peut être ajouté aux sessions depuis le dashboard.</small>
      <button class="primary">Enregistrer</button>
      <div id="msg2"></div>
    </form>
  </section>
  <script src="options.js"></script>
</body>
</html>
